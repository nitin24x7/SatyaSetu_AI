openapi: 3.1.0
info:
  title: SatyaSetu AI Core Microservices API
  version: 1.0.0
  description: |
    Production-grade REST API Gateway for SatyaSetu AI: AI-Powered Document Authentication, 
    Entity Concordance Verification, and Regulatory Compliance Management Platform.
  contact:
    name: SatyaSetu Regulatory Architecture Team
    email: api-directorate@satyasetu.gov.in
  license:
    name: Proprietary Enterprise License

servers:
  - url: http://localhost:4000
    description: Local Microservices Gateway
  - url: https://api.satyasetu.gov.in
    description: Production Regulatory Gateway

tags:
  - name: Applications
    description: Statutory application submission, triage, and lifecycle state transitions
  - name: Documents
    description: Encrypted S3/MinIO document upload tickets, presigned links, and validation
  - name: Institutions
    description: Regulatory master directory of accredited universities and technical institutes
  - name: Audit
    description: Immutable append-only audit trail and compliance event ledger
  - name: Analytics
    description: Institutional throughput, clearance rates, and failure statistics
  - name: IDP
    description: Intelligent Document Processing, layout segmentation, multilingual OCR, and tabular extraction
  - name: Compliance
    description: Deterministic Compliance Verification, Concordance Matching, Cadre Norms, and Rule Engine
  - name: Authentication
    description: Institutional identity, OAuth 2.0 PKCE, TOTP MFA, and token lifecycle
  - name: Integrations
    description: Statutory government bridges (DigiLocker, Aadhaar eSign, AISHE / NAD)
  - name: Forensics
    description: Document forensics, Error Level Analysis (ELA), Copy-Move Forgery Detection (CMFD), and pHash deduplication
  - name: Workflow
    description: Finite State Machine (FSM) orchestration, statutory SLA turnaround tracking, workload balancing, and multi-channel notifications
  - name: Ledger
    description: Cryptographic hash-chained audit ledger, Merkle root notarization, and digital clearance certificate registry
  - name: Security & Staging
    description: CERT-In compliance audit, OWASP Top 10 defenses, DPDP Act 2023 redaction, 10,000-user load benchmark, Disaster Recovery RPO/RTO failover, and Production Staging Runbooks
  - name: System
    description: Health and telemetry probes for database, cache, and object storage

paths:
  /health:
    get:
      tags: [System]
      summary: Microservice cluster readiness & liveness probe
      description: Evaluates connectivity and latency to PostgreSQL, Redis cluster, and S3/MinIO.
      responses:
        '200':
          description: All critical backend dependencies operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more critical services are degraded

  /api/v1/applications:
    get:
      tags: [Applications]
      summary: Query application pipeline with pagination and multi-field filters
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: riskLevel
          in: query
          schema: { $ref: '#/components/schemas/RiskLevel' }
        - name: institutionType
          in: query
          schema: { type: string }
        - name: reviewerId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema: { type: string, default: 'submittedAt' }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated application list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPaginationResponse'

    post:
      tags: [Applications]
      summary: Create application draft or execute formal submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'

  /api/v1/applications/{id}:
    get:
      tags: [Applications]
      summary: Retrieve full application dossier with documents, findings, and timeline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full application detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
        '404':
          description: Application not found

  /api/v1/applications/{id}/verify:
    post:
      tags: [Applications]
      summary: Transition submitted application into active verification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Application marked Under Verification

  /api/v1/applications/{id}/assign:
    post:
      tags: [Applications]
      summary: Assign or reassign regulatory reviewer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerId]
              properties:
                reviewerId: { type: string }
      responses:
        '200':
          description: Reviewer assigned

  /api/v1/applications/{id}/corrections:
    post:
      tags: [Applications]
      summary: Dispatch correction notice to applicant with flagged findings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                findingIds:
                  type: array
                  items: { type: string }
                comment: { type: string }
                dueDate: { type: string, format: date }
      responses:
        '200':
          description: Application status set to Action Required

  /api/v1/applications/{id}/resubmit:
    post:
      tags: [Applications]
      summary: Applicant resubmission addressing assessor corrections
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicantResponse]
              properties:
                applicantResponse: { type: string }
                updatedDocs: { type: array, items: { type: object } }
      responses:
        '200':
          description: Application status set to Resubmitted

  /api/v1/applications/{id}/decision:
    post:
      tags: [Applications]
      summary: Adjudicate application approval or recorded rejection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reasonOrComment]
              properties:
                decision: { type: string, enum: [Verified, Rejected] }
                reasonOrComment: { type: string }
      responses:
        '200':
          description: Decision recorded in audit ledger

  /api/v1/applications/{id}/override:
    post:
      tags: [Applications]
      summary: Administrative override to reopen finalized case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              properties:
                justification: { type: string }
      responses:
        '200':
          description: Case reverted to Under Verification

  /api/v1/documents/presigned-url:
    post:
      tags: [Documents]
      summary: Generate encrypted presigned S3/MinIO upload ticket
      description: Returns pre-authorized upload URL with SSE-S3 AES-256 encryption headers and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, category, fileName, mimeType]
              properties:
                applicationId: { type: string }
                category: { type: string }
                fileName: { type: string }
                mimeType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                expiresInSeconds: { type: integer, default: 900 }
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadTicket'

  /api/v1/documents/{id}/download:
    get:
      tags: [Documents]
      summary: Generate temporary presigned download link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: s3Key
          in: query
          required: true
          schema: { type: string }
        - name: fileName
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Temporary download URL returned

  /api/v1/institutions:
    get:
      tags: [Institutions]
      summary: List registered universities and accredited institutions
      responses:
        '200':
          description: Institution master records

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: Stream immutable append-only compliance audit trail
      responses:
        '200':
          description: Chronological audit events with hash chaining

  /api/v1/reports/analytics:
    get:
      tags: [Analytics]
      summary: Aggregated regulatory throughput, turnaround times, and clearance ratios
      responses:
        '200':
          description: Platform analytical metrics

  /api/v1/idp/process:
    post:
      tags: [IDP]
      summary: Enqueue document for background asynchronous OCR & IDP pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '202':
          description: Ingestion initiated; asynchronous processing enqueued
        '400':
          description: Invalid request parameters

  /api/v1/idp/extract-sync:
    post:
      tags: [IDP]
      summary: Synchronous document OCR tokenization, table matrix parsing, and entity extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '200':
          description: Complete extraction result with bounding boxes and mathematical validation

  /api/v1/idp/jobs/{jobId}:
    get:
      tags: [IDP]
      summary: Query real-time status and extraction results of an IDP job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status and extraction payload
        '404':
          description: Job identifier not found

  /api/v1/idp/jobs:
    get:
      tags: [IDP]
      summary: List recent IDP processing jobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of IDP processing summaries

  /api/v1/idp/categories:
    get:
      tags: [IDP]
      summary: Get supported regulatory document templates and formats
      responses:
        '200':
          description: Supported document categories list

  /api/v1/compliance/evaluate:
    post:
      tags: [Compliance]
      summary: Evaluate application dossier against statutory compliance rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationId: { type: string }
                application: { type: object }
                documents: { type: array, items: { type: object } }
      responses:
        '200':
          description: Comprehensive compliance evaluation summary with score and findings

  /api/v1/compliance/applications/{id}:
    get:
      tags: [Compliance]
      summary: Evaluate existing application by identifier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Compliance score and findings report

  /api/v1/compliance/concordance:
    post:
      tags: [Compliance]
      summary: Cross-reference declared vs extracted attributes using Jaro-Winkler and Levenshtein metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declared]
              properties:
                declared: { type: object }
                extractedEntities: { type: object }
      responses:
        '200':
          description: Concordance report with field-level similarity confidence and match status

  /api/v1/compliance/calculus/cadre:
    post:
      tags: [Compliance]
      summary: Calculate Student-to-Faculty Ratio (SFR) and cadre distribution norms
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                totalStudents: { type: integer }
                professors: { type: integer }
                assocProfessors: { type: integer }
                asstProfessors: { type: integer }
                institutionType: { type: string }
      responses:
        '200':
          description: Cadre calculus verification result

  /api/v1/compliance/calculus/infrastructure:
    post:
      tags: [Compliance]
      summary: Calculate built instructional carpet area norms and surplus/deficit
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                totalStudents: { type: integer }
                actualBuiltCarpetArea: { type: number }
      responses:
        '200':
          description: Infrastructure carpet area calculus result

  /api/v1/compliance/rules:
    get:
      tags: [Compliance]
      summary: List all registered statutory compliance rules with standards and weights
      responses:
        '200':
          description: List of statutory compliance rules

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials and return tokens or MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authentication successful or MFA challenge returned

  /api/v1/auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify 6-digit TOTP code and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaSessionId, code]
              properties:
                mfaSessionId: { type: string }
                code: { type: string }
      responses:
        '200':
          description: MFA successfully verified

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token rotated

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve current authenticated user profile and scopes
      responses:
        '200':
          description: User profile payload

  /api/v1/integrations/digilocker/pull:
    post:
      tags: [Integrations]
      summary: Pull certified statutory document directly from National DigiLocker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docUri, docType, consent, institutionAisheCode]
              properties:
                docUri: { type: string }
                docType: { type: string, enum: [CHARTER, AFFILIATION_ORDER, ACCREDITATION_CERT, DEGREE, LAND_TITLE] }
                consent: { type: boolean }
                institutionAisheCode: { type: string }
      responses:
        '200':
          description: Certified DigiLocker document with PKI signature

  /api/v1/integrations/esign/verify:
    post:
      tags: [Integrations]
      summary: Verify Aadhaar eSign or DSC cryptographic signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, fileName]
              properties:
                documentId: { type: string }
                fileName: { type: string }
                signatureHex: { type: string }
      responses:
        '200':
          description: Digital signature verification result

  /api/v1/integrations/aishe/sync:
    post:
      tags: [Integrations]
      summary: Synchronize institutional master record with AISHE National Portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aisheCode]
              properties:
                aisheCode: { type: string }
      responses:
        '200':
          description: Synchronized AISHE institutional profile

  /api/v1/integrations/status:
    get:
      tags: [Integrations]
      summary: Telemetry and SLA health monitor for statutory government adapters
      responses:
        '200':
          description: Status of all statutory adapters

  /api/v1/forensics/analyze:
    post:
      tags: [Forensics]
      summary: Multi-layer document forensic inspection (ELA, CMFD, PDF inspection, pHash)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, applicationId, fileName]
              properties:
                documentId: { type: string }
                applicationId: { type: string }
                fileName: { type: string }
                category: { type: string }
                isSimulatedTampered: { type: boolean }
                isSimulatedCloned: { type: boolean }
                isSimulatedRecycled: { type: boolean }
      responses:
        '200':
          description: Comprehensive forensic report with spatial anomaly polygons and tamper score

  /api/v1/forensics/ela:
    post:
      tags: [Forensics]
      summary: Standalone Error Level Analysis (ELA) for compression artifact detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties:
                fileName: { type: string }
                isSimulatedTampered: { type: boolean }
      responses:
        '200':
          description: ELA error rate distribution and residual anomaly regions

  /api/v1/forensics/cmfd:
    post:
      tags: [Forensics]
      summary: Standalone Copy-Move Forgery Detection (CMFD) for cloned seals or signatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties:
                fileName: { type: string }
                isSimulatedCloned: { type: boolean }
      responses:
        '200':
          description: Matched spatial keypoint pairs and cloned region coordinates

  /api/v1/forensics/pdf-inspect:
    post:
      tags: [Forensics]
      summary: Inspect PDF revision trees, overlaid vector objects, and font embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties:
                fileName: { type: string }
                isSimulatedTampered: { type: boolean }
      responses:
        '200':
          description: PDF structural revision analysis and authoring software metadata

  /api/v1/forensics/fingerprint:
    post:
      tags: [Forensics]
      summary: Compute perceptual dHash fingerprint & check cross-institutional document recycling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties:
                fileName: { type: string }
                applicationId: { type: string }
                institutionId: { type: string }
                isSimulatedRecycled: { type: boolean }
      responses:
        '200':
          description: Perceptual hash and deduplication check result

  /api/v1/forensics/reports/{documentId}:
    get:
      tags: [Forensics]
      summary: Retrieve cached forensic report for a document
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Document forensic inspection report
        '404':
          description: Report not found

  /api/v1/forensics/reports:
    get:
      tags: [Forensics]
      summary: List recent document forensic inspection reports
      responses:
        '200':
          description: List of forensic reports

  /api/v1/workflow/transition:
    post:
      tags: [Workflow]
      summary: Execute FSM State Transition with statutory precondition validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, action, targetState, actorId, actorName, actorRole]
              properties:
                applicationId: { type: string }
                action: { type: string }
                targetState: { type: string }
                actorId: { type: string }
                actorName: { type: string }
                actorRole: { type: string }
                comment: { type: string }
                justification: { type: string }
                complianceScore: { type: number }
      responses:
        '200':
          description: State transition executed successfully
        '400':
          description: Precondition validation or legal transition failure

  /api/v1/workflow/override:
    post:
      tags: [Workflow]
      summary: Executive Administrative Override by Compliance Director
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, justification, actorId, actorName]
              properties:
                applicationId: { type: string }
                justification: { type: string }
                actorId: { type: string }
                actorName: { type: string }
      responses:
        '200':
          description: Administrative override applied and case reopened

  /api/v1/workflow/allowed-transitions/{applicationId}:
    get:
      tags: [Workflow]
      summary: Query permitted next actions and target states
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Allowed transition options

  /api/v1/workflow/history/{applicationId}:
    get:
      tags: [Workflow]
      summary: Retrieve chronological state machine transition events
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Transition history ledger

  /api/v1/workflow/sla/{applicationId}:
    get:
      tags: [Workflow]
      summary: Query statutory SLA turnaround metrics and breach status
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SLA tracking metrics and countdown

  /api/v1/workflow/sla/evaluate-all:
    post:
      tags: [Workflow]
      summary: Batch evaluate statutory SLAs across all active applications
      responses:
        '200':
          description: SLA audit summary and escalation count

  /api/v1/workflow/assign/auto:
    post:
      tags: [Workflow]
      summary: Automatically balance and assign application to optimal reviewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId: { type: string }
      responses:
        '200':
          description: Reviewer auto-assigned successfully

  /api/v1/workflow/reviewers/workload:
    get:
      tags: [Workflow]
      summary: Get workload balance and queue depths for all reviewers
      responses:
        '200':
          description: Reviewer workload profiles and utilization rates

  /api/v1/workflow/notifications/dispatch:
    post:
      tags: [Workflow]
      summary: Dispatch multi-channel notification (In-App, Email, SMS, Webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId, recipientRole, eventType]
              properties:
                recipientId: { type: string }
                recipientRole: { type: string }
                eventType: { type: string }
                applicationId: { type: string }
                channels: { type: array, items: { type: string } }
                customTitle: { type: string }
                customMessage: { type: string }
      responses:
        '200':
          description: Notifications dispatched

  /api/v1/workflow/notifications/{recipientId}:
    get:
      tags: [Workflow]
      summary: Retrieve notifications by recipient ID
      parameters:
        - name: recipientId
          in: path
          required: true
          schema: { type: string }
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Recipient notifications

  /api/v1/workflow/notifications/{id}/read:
    patch:
      tags: [Workflow]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification status updated

  /api/v1/ledger/record:
    post:
      tags: [Ledger]
      summary: Append immutable cryptographically hashed block to audit ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, actorId, actorName, actorRole, actionType, actionDescription, payload]
              properties:
                applicationId: { type: string }
                institutionId: { type: string }
                actorId: { type: string }
                actorName: { type: string }
                actorRole: { type: string }
                actionType: { type: string }
                actionDescription: { type: string }
                payload: { type: object }
      responses:
        '201':
          description: Block appended successfully

  /api/v1/ledger/chain:
    get:
      tags: [Ledger]
      summary: Retrieve chronological cryptographic audit blocks
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: applicationId
          in: query
          schema: { type: string }
        - name: actionType
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of audit blocks

  /api/v1/ledger/verify:
    get:
      tags: [Ledger]
      summary: Execute end-to-end cryptographic hash chain verification
      responses:
        '200':
          description: Chain verification result

  /api/v1/ledger/merkle-root:
    get:
      tags: [Ledger]
      summary: Retrieve current binary Merkle tree root hash
      responses:
        '200':
          description: Merkle root hash

  /api/v1/ledger/certificates/generate:
    post:
      tags: [Ledger]
      summary: Generate digitally signed compliance clearance certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId]
              properties:
                applicationId: { type: string }
                complianceScore: { type: number }
                sanctionedIntake: { type: integer }
                approvedProgramsCount: { type: integer }
                calculatedSfr: { type: number }
                authorizerName: { type: string }
                authorizerDesignation: { type: string }
      responses:
        '201':
          description: Certificate generated

  /api/v1/ledger/certificates/verify/{certificateNumber}:
    get:
      tags: [Ledger]
      summary: Verify clearance certificate authenticity via QR scan
      parameters:
        - name: certificateNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Certificate verification result

  /api/v1/ledger/certificates/{applicationId}:
    get:
      tags: [Ledger]
      summary: Retrieve clearance certificate for an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Certificate details

  /api/v1/reports/intelligence:
    get:
      tags: [Analytics]
      summary: Retrieve macroeconomic regulatory intelligence and defect indices
      responses:
        '200':
          description: Regulatory intelligence report

  /api/v1/reports/gazette/{applicationId}:
    get:
      tags: [Analytics]
      summary: Generate official statutory gazette summary dossier
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Gazette summary dossier

  /api/v1/security/audit/run:
    post:
      tags: [Security & Staging]
      summary: Execute automated CERT-In & OWASP Top 10 security audit
      responses:
        '200':
          description: Signed CERT-In security clearance report

  /api/v1/security/audit/report:
    get:
      tags: [Security & Staging]
      summary: Retrieve latest CERT-In security audit report
      responses:
        '200':
          description: Latest CERT-In audit report

  /api/v1/security/dpdp/redact:
    post:
      tags: [Security & Staging]
      summary: Redact sensitive PII under Digital Personal Data Protection (DPDP) Act 2023
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                payload: { type: object }
      responses:
        '200':
          description: Redacted personal data with tamper-proof audit attestation

  /api/v1/security/load-test/simulate:
    post:
      tags: [Security & Staging]
      summary: Simulate high-concurrency peak filing deadline stress benchmark (10,000 users)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                concurrentSubmissions: { type: integer, default: 10000 }
                durationSeconds: { type: integer, default: 60 }
                scenarioName: { type: string }
                targetEndpoint: { type: string }
                peakRpsThreshold: { type: integer, default: 1200 }
      responses:
        '200':
          description: Latency percentiles and throughput benchmark report

  /api/v1/security/load-test/latest:
    get:
      tags: [Security & Staging]
      summary: Retrieve latest high-concurrency load benchmark report
      responses:
        '200':
          description: Latest load benchmark report

  /api/v1/security/dr/status:
    get:
      tags: [Security & Staging]
      summary: Retrieve live Disaster Recovery & High-Availability replication status
      responses:
        '200':
          description: Current RPO/RTO metrics and replication health

  /api/v1/security/dr/drill:
    post:
      tags: [Security & Staging]
      summary: Execute automated Disaster Recovery failover drill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                simulatedFailureType: { type: string, enum: [REGION_OUTAGE, PRIMARY_DB_CRASH, S3_STORAGE_PARTITION] }
      responses:
        '200':
          description: Completed DR failover drill certification

  /api/v1/security/staging/status:
    get:
      tags: [Security & Staging]
      summary: Retrieve staged pilot rollout progress and readiness gates
      responses:
        '200':
          description: Stage status (Stage A, Stage B, Stage C) and gate evaluations

  /api/v1/security/staging/promote:
    post:
      tags: [Security & Staging]
      summary: Promote institutional staging rollout to the next phase
      responses:
        '200':
          description: Updated rollout stage

  /api/v1/security/runbook:
    get:
      tags: [Security & Staging]
      summary: Retrieve production standard operating procedures and runbooks
      responses:
        '200':
          description: Operational runbooks and escalation matrices

components:
  schemas:
    ApplicationStatus:
      type: string
      enum:
        - Draft
        - Submitted
        - Under Verification
        - Action Required
        - Resubmitted
        - Verified
        - Rejected

    RiskLevel:
      type: string
      enum:
        - Low
        - Medium
        - High

    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED] }
        timestamp: { type: string, format: date-time }
        services:
          type: object
          properties:
            database: { type: object }
            cache: { type: object }
            storage: { type: object }
        version: { type: string }

    CreateApplicationRequest:
      type: object
      required:
        - institutionName
        - institutionType
        - state
        - applicationType
        - purpose
      properties:
        institutionId: { type: string }
        institutionName: { type: string }
        institutionType: { type: string }
        state: { type: string }
        applicationType: { type: string }
        academicYear: { type: string, default: '2026-2027' }
        purpose: { type: string }
        referenceNumber: { type: string }
        remarks: { type: string }
        documents: { type: array, items: { type: object } }
        isSubmit: { type: boolean, default: false }

    PresignedUploadTicket:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
        s3Key: { type: string }
        bucket: { type: string }
        expiresInSeconds: { type: integer }
        requiredHeaders: { type: object }

    ApplicationEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { type: object }
        timestamp: { type: string, format: date-time }

    ApplicationPaginationResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { type: object } }
        pagination:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }
            totalPages: { type: integer }
        timestamp: { type: string, format: date-time }

    ProcessDocumentRequest:
      type: object
      required:
        - documentId
        - applicationId
        - fileName
        - category
      properties:
        documentId: { type: string }
        applicationId: { type: string }
        fileName: { type: string }
        category: { type: string }
        fileSizeBytes: { type: integer }
        mimeType: { type: string }
        institutionName: { type: string }
        registrationNumber: { type: string }

    CertInAuditReport:
      type: object
      properties:
        reportId: { type: string }
        auditScope: { type: string }
        empanelledAuditor: { type: string }
        standard: { type: string }
        status: { type: string, enum: [COMPLIANT, NON_COMPLIANT, CONDITIONALLY_COMPLIANT] }
        overallScore: { type: integer }
        totalChecksEvaluated: { type: integer }
        passedChecks: { type: integer }
        criticalVulnerabilitiesCount: { type: integer }
        highVulnerabilitiesCount: { type: integer }
        cryptographicSignature: { type: string }
        generatedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }

    LoadTestBenchmarkReport:
      type: object
      properties:
        testId: { type: string }
        scenarioName: { type: string }
        totalSubmissionsExecuted: { type: integer }
        achievedThroughputRps: { type: integer }
        errorRatePercentage: { type: number }
        verdict: { type: string, enum: [PASSED, FAILED, DEGRADED] }
        latency:
          type: object
          properties:
            p50Ms: { type: integer }
            p90Ms: { type: integer }
            p95Ms: { type: integer }
            p99Ms: { type: integer }

    DisasterRecoveryStatus:
      type: object
      properties:
        serviceName: { type: string }
        deploymentMode: { type: string }
        targetRpoSeconds: { type: number }
        achievedRpoSeconds: { type: number }
        targetRtoSeconds: { type: number }
        achievedRtoSeconds: { type: number }
        operationalReadiness: { type: string }

    StagingRolloutStatus:
      type: object
      properties:
        currentStage: { type: string }
        stageDisplayName: { type: string }
        progressPercentage: { type: integer }
        targetGoLiveDate: { type: string, format: date-time }
        allGatesSatisfied: { type: boolean }



