openapi: 3.1.0
info:
  title: SatyaSetu AI Core Microservices API
  version: 1.0.0
  description: |
    Production-grade REST API Gateway for SatyaSetu AI: AI-Powered Document Authentication, 
    Entity Concordance Verification, and Regulatory Compliance Management Platform.
  contact:
    name: SatyaSetu Regulatory Architecture Team
    email: api-directorate@satyasetu.gov.in
  license:
    name: Proprietary Enterprise License

servers:
  - url: http://localhost:4000
    description: Local Microservices Gateway
  - url: https://api.satyasetu.gov.in
    description: Production Regulatory Gateway

tags:
  - name: Applications
    description: Statutory application submission, triage, and lifecycle state transitions
  - name: Documents
    description: Encrypted S3/MinIO document upload tickets, presigned links, and validation
  - name: Institutions
    description: Regulatory master directory of accredited universities and technical institutes
  - name: Audit
    description: Immutable append-only audit trail and compliance event ledger
  - name: Analytics
    description: Institutional throughput, clearance rates, and failure statistics
  - name: IDP
    description: Intelligent Document Processing, layout segmentation, multilingual OCR, and tabular extraction
  - name: Compliance
    description: Deterministic Compliance Verification, Concordance Matching, Cadre Norms, and Rule Engine
  - name: Authentication
    description: Institutional identity, OAuth 2.0 PKCE, TOTP MFA, and token lifecycle
  - name: Integrations
    description: Statutory government bridges (DigiLocker, Aadhaar eSign, AISHE / NAD)
  - name: System
    description: Health and telemetry probes for database, cache, and object storage

paths:
  /health:
    get:
      tags: [System]
      summary: Microservice cluster readiness & liveness probe
      description: Evaluates connectivity and latency to PostgreSQL, Redis cluster, and S3/MinIO.
      responses:
        '200':
          description: All critical backend dependencies operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more critical services are degraded

  /api/v1/applications:
    get:
      tags: [Applications]
      summary: Query application pipeline with pagination and multi-field filters
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: riskLevel
          in: query
          schema: { $ref: '#/components/schemas/RiskLevel' }
        - name: institutionType
          in: query
          schema: { type: string }
        - name: reviewerId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema: { type: string, default: 'submittedAt' }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated application list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPaginationResponse'

    post:
      tags: [Applications]
      summary: Create application draft or execute formal submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'

  /api/v1/applications/{id}:
    get:
      tags: [Applications]
      summary: Retrieve full application dossier with documents, findings, and timeline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full application detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
        '404':
          description: Application not found

  /api/v1/applications/{id}/verify:
    post:
      tags: [Applications]
      summary: Transition submitted application into active verification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Application marked Under Verification

  /api/v1/applications/{id}/assign:
    post:
      tags: [Applications]
      summary: Assign or reassign regulatory reviewer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerId]
              properties:
                reviewerId: { type: string }
      responses:
        '200':
          description: Reviewer assigned

  /api/v1/applications/{id}/corrections:
    post:
      tags: [Applications]
      summary: Dispatch correction notice to applicant with flagged findings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                findingIds:
                  type: array
                  items: { type: string }
                comment: { type: string }
                dueDate: { type: string, format: date }
      responses:
        '200':
          description: Application status set to Action Required

  /api/v1/applications/{id}/resubmit:
    post:
      tags: [Applications]
      summary: Applicant resubmission addressing assessor corrections
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicantResponse]
              properties:
                applicantResponse: { type: string }
                updatedDocs: { type: array, items: { type: object } }
      responses:
        '200':
          description: Application status set to Resubmitted

  /api/v1/applications/{id}/decision:
    post:
      tags: [Applications]
      summary: Adjudicate application approval or recorded rejection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reasonOrComment]
              properties:
                decision: { type: string, enum: [Verified, Rejected] }
                reasonOrComment: { type: string }
      responses:
        '200':
          description: Decision recorded in audit ledger

  /api/v1/applications/{id}/override:
    post:
      tags: [Applications]
      summary: Administrative override to reopen finalized case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              properties:
                justification: { type: string }
      responses:
        '200':
          description: Case reverted to Under Verification

  /api/v1/documents/presigned-url:
    post:
      tags: [Documents]
      summary: Generate encrypted presigned S3/MinIO upload ticket
      description: Returns pre-authorized upload URL with SSE-S3 AES-256 encryption headers and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, category, fileName, mimeType]
              properties:
                applicationId: { type: string }
                category: { type: string }
                fileName: { type: string }
                mimeType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                expiresInSeconds: { type: integer, default: 900 }
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadTicket'

  /api/v1/documents/{id}/download:
    get:
      tags: [Documents]
      summary: Generate temporary presigned download link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: s3Key
          in: query
          required: true
          schema: { type: string }
        - name: fileName
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Temporary download URL returned

  /api/v1/institutions:
    get:
      tags: [Institutions]
      summary: List registered universities and accredited institutions
      responses:
        '200':
          description: Institution master records

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: Stream immutable append-only compliance audit trail
      responses:
        '200':
          description: Chronological audit events with hash chaining

  /api/v1/reports/analytics:
    get:
      tags: [Analytics]
      summary: Aggregated regulatory throughput, turnaround times, and clearance ratios
      responses:
        '200':
          description: Platform analytical metrics

  /api/v1/idp/process:
    post:
      tags: [IDP]
      summary: Enqueue document for background asynchronous OCR & IDP pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '202':
          description: Ingestion initiated; asynchronous processing enqueued
        '400':
          description: Invalid request parameters

  /api/v1/idp/extract-sync:
    post:
      tags: [IDP]
      summary: Synchronous document OCR tokenization, table matrix parsing, and entity extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '200':
          description: Complete extraction result with bounding boxes and mathematical validation

  /api/v1/idp/jobs/{jobId}:
    get:
      tags: [IDP]
      summary: Query real-time status and extraction results of an IDP job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status and extraction payload
        '404':
          description: Job identifier not found

  /api/v1/idp/jobs:
    get:
      tags: [IDP]
      summary: List recent IDP processing jobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of IDP processing summaries

  /api/v1/idp/categories:
    get:
      tags: [IDP]
      summary: Get supported regulatory document templates and formats
      responses:
        '200':
          description: Supported document categories list

  /api/v1/compliance/evaluate:
    post:
      tags: [Compliance]
      summary: Evaluate application dossier against statutory compliance rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationId: { type: string }
                application: { type: object }
                documents: { type: array, items: { type: object } }
      responses:
        '200':
          description: Comprehensive compliance evaluation summary with score and findings

  /api/v1/compliance/applications/{id}:
    get:
      tags: [Compliance]
      summary: Evaluate existing application by identifier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Compliance score and findings report

  /api/v1/compliance/concordance:
    post:
      tags: [Compliance]
      summary: Cross-reference declared vs extracted attributes using Jaro-Winkler and Levenshtein metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declared]
              properties:
                declared: { type: object }
                extractedEntities: { type: object }
      responses:
        '200':
          description: Concordance report with field-level similarity confidence and match status

  /api/v1/compliance/calculus/cadre:
    post:
      tags: [Compliance]
      summary: Calculate Student-to-Faculty Ratio (SFR) and cadre distribution norms
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                totalStudents: { type: integer }
                professors: { type: integer }
                assocProfessors: { type: integer }
                asstProfessors: { type: integer }
                institutionType: { type: string }
      responses:
        '200':
          description: Cadre calculus verification result

  /api/v1/compliance/calculus/infrastructure:
    post:
      tags: [Compliance]
      summary: Calculate built instructional carpet area norms and surplus/deficit
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                totalStudents: { type: integer }
                actualBuiltCarpetArea: { type: number }
      responses:
        '200':
          description: Infrastructure carpet area calculus result

  /api/v1/compliance/rules:
    get:
      tags: [Compliance]
      summary: List all registered statutory compliance rules with standards and weights
      responses:
        '200':
          description: List of statutory compliance rules

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials and return tokens or MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authentication successful or MFA challenge returned

  /api/v1/auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify 6-digit TOTP code and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaSessionId, code]
              properties:
                mfaSessionId: { type: string }
                code: { type: string }
      responses:
        '200':
          description: MFA successfully verified

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token rotated

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve current authenticated user profile and scopes
      responses:
        '200':
          description: User profile payload

  /api/v1/integrations/digilocker/pull:
    post:
      tags: [Integrations]
      summary: Pull certified statutory document directly from National DigiLocker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docUri, docType, consent, institutionAisheCode]
              properties:
                docUri: { type: string }
                docType: { type: string, enum: [CHARTER, AFFILIATION_ORDER, ACCREDITATION_CERT, DEGREE, LAND_TITLE] }
                consent: { type: boolean }
                institutionAisheCode: { type: string }
      responses:
        '200':
          description: Certified DigiLocker document with PKI signature

  /api/v1/integrations/esign/verify:
    post:
      tags: [Integrations]
      summary: Verify Aadhaar eSign or DSC cryptographic signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, fileName]
              properties:
                documentId: { type: string }
                fileName: { type: string }
                signatureHex: { type: string }
      responses:
        '200':
          description: Digital signature verification result

  /api/v1/integrations/aishe/sync:
    post:
      tags: [Integrations]
      summary: Synchronize institutional master record with AISHE National Portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aisheCode]
              properties:
                aisheCode: { type: string }
      responses:
        '200':
          description: Synchronized AISHE institutional profile

  /api/v1/integrations/status:
    get:
      tags: [Integrations]
      summary: Telemetry and SLA health monitor for statutory government adapters
      responses:
        '200':
          description: Status of all statutory adapters

components:
  schemas:
    ApplicationStatus:
      type: string
      enum:
        - Draft
        - Submitted
        - Under Verification
        - Action Required
        - Resubmitted
        - Verified
        - Rejected

    RiskLevel:
      type: string
      enum:
        - Low
        - Medium
        - High

    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED] }
        timestamp: { type: string, format: date-time }
        services:
          type: object
          properties:
            database: { type: object }
            cache: { type: object }
            storage: { type: object }
        version: { type: string }

    CreateApplicationRequest:
      type: object
      required:
        - institutionName
        - institutionType
        - state
        - applicationType
        - purpose
      properties:
        institutionId: { type: string }
        institutionName: { type: string }
        institutionType: { type: string }
        state: { type: string }
        applicationType: { type: string }
        academicYear: { type: string, default: '2026-2027' }
        purpose: { type: string }
        referenceNumber: { type: string }
        remarks: { type: string }
        documents: { type: array, items: { type: object } }
        isSubmit: { type: boolean, default: false }

    PresignedUploadTicket:
      type: object
      properties:
        uploadUrl: { type: string, format: uri }
        s3Key: { type: string }
        bucket: { type: string }
        expiresInSeconds: { type: integer }
        requiredHeaders: { type: object }

    ApplicationEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { type: object }
        timestamp: { type: string, format: date-time }

    ApplicationPaginationResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { type: array, items: { type: object } }
        pagination:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }
            totalPages: { type: integer }
        timestamp: { type: string, format: date-time }

    ProcessDocumentRequest:
      type: object
      required:
        - documentId
        - applicationId
        - fileName
        - category
      properties:
        documentId: { type: string }
        applicationId: { type: string }
        fileName: { type: string }
        category: { type: string }
        fileSizeBytes: { type: integer }
        mimeType: { type: string }
        institutionName: { type: string }
        registrationNumber: { type: string }


